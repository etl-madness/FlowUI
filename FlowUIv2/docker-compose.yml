# =============================================================================
# FlowUIv2 Docker Compose (Project Directory Context)
# Connects strictly to go-flowAPI using the interactive user's login credentials.
#
# Usage (from FlowUIv2/ folder):
#   docker compose up -d --build
# =============================================================================

services:
  flowuiv2:
    build:
      context: .
      dockerfile: Dockerfile
    image: flowuiv2:latest
    container_name: flowuiv2
    restart: unless-stopped
    ports:
      - "${FLOW_UI_PORT:-5185}:5185"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Production}"
      ASPNETCORE_URLS: "http://+:5185"
      FLOW_UI_PORT: "5185"
      FLOW_API_HOST: "${FLOW_API_HOST:-http://host.docker.internal}"
      FLOW_API_PORT: "${FLOW_API_PORT:-8080}"
      FLOW_UI_AUTH_MODE: "${FLOW_UI_AUTH_MODE:-ApiBasic}"
